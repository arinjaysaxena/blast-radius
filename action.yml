name: blast-radius
description: Diff the public API of two npm package versions and comment which call sites are affected.
inputs:
  old:
    description: Old version, as a directory or npm spec such as pkg@1.0.0
    required: true
  new:
    description: New version, as a directory or npm spec such as pkg@2.0.0
    required: true
  project:
    description: Project directory to scan for call sites
    default: '.'
  token:
    description: Token used to post the comment
    default: ${{ github.token }}
  fail-on-breaking:
    description: Fail the job when breaking changes are found
    default: 'false'
  dry-run:
    description: Print the comment instead of posting it
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - run: npm install --omit=dev --no-audit --no-fund
      shell: bash
      working-directory: ${{ github.action_path }}
    - run: node "${{ github.action_path }}/bin/blast-radius-action.js"
      shell: bash
      env:
        INPUT_OLD: ${{ inputs.old }}
        INPUT_NEW: ${{ inputs.new }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_FAIL_ON_BREAKING: ${{ inputs.fail-on-breaking }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
